<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Sesame 5 BLE banner</title>
  <desc id="desc">A white-background banner for the Sesame 5 BLE Home Assistant custom integration, featuring a modern smart lock icon and the product name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="url(#bg)"/>

  <g transform="translate(90 56)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="220" rx="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M52 101V63C52 29 76 8 110 8C144 8 168 29 168 63V101" fill="none" stroke="url(#door)" stroke-width="20" stroke-linecap="round"/>
    <rect x="34" y="88" width="152" height="96" rx="22" fill="#ffffff"/>
    <circle cx="110" cy="136" r="12" fill="url(#accent)"/>
    <path d="M76 138c10-18 20-27 34-27s24 9 34 27" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 176c12-16 25-22 40-22 15 0 28 6 40 22" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(380 122)">
    <text x="0" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#0f172a">Sesame 5 BLE</text>
    <text x="2" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#475569" letter-spacing="1.5">SMART LOCK INTEGRATION</text>
    <rect x="2" y="154" width="220" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#475569">Home Assistant • BLE • Local Control</text>
  </g>
</svg>
